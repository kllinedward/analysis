                const avgFreshman = (qs.reduce((acc, q) => acc + (q.freshman || 0), 0) / qs.length);

                qs.forEach(q => {

                    subcapGroups[sub].sumFresh += (q.freshman || 0);
                    subcapGroups[sub].sumNat += (q.national || 0);
                });

                const subcapStats = Object.values(subcapGroups).map(g => ({
                    name: g.subcap,
                    count: g.count,
                    freshman: Number((g.sumFresh / g.count).toFixed(2)),

                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-800 tracking-tight flex items-center gap-2">
                                        高一新生會考學力與高中銜接分析
                                        <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-medium border border-indigo-200/50">
                                            心測中心官方診斷
                                        </span>
                                    </h1>
                                    <p className="text-xs text-slate-500">
                                        曉明女中 數學科教學研究會專屬分析平台
                                    </p>
                                </div>
                            </div>

                            {/* Year Switcher and Action Buttons */}
                            <div className="flex items-center space-x-3">
                                {/* Year Selector Dropdown */}
                                <div className="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    <label className="text-xs font-semibold text-slate-600 pl-2 pr-1 flex items-center gap-1">
                                        <Icons.Calendar />
                                        <span>學年度:</span>
                                    </label>
                                    <select 
                                        value={selectedYear} 
                                        onChange={(e) => setSelectedYear(e.target.value)}
                                        className="bg-white text-slate-800 font-bold text-sm rounded-md px-3 py-1 border-0 shadow-sm focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                                    >
                                        {Object.keys(yearsData).sort((a,b) => b.localeCompare(a)).map(yr => (
                                            <option key={yr} value={yr}>
                                                {yr} 學年度 ({yearsData[yr].studentCount || '274'} 人)
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                {/* Import Button */}
                                <button 
                                    onClick={() => setShowImportModal(true)}
                                    className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-sm font-medium hover:from-emerald-700 hover:to-teal-700 transition shadow-sm"
                                    title="匯入明年或新年度心測中心 PDF / Excel 報表"
                                >
                                    <Icons.Upload />
                                    <span>➕ 匯入新學年度</span>
                                </button>

                                {/* Manage / Backup Button */}
                                <button
                                    onClick={() => setShowManageModal(true)}
                                    className="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition"
                                    title="學年度資料備份與管理"
                                >
                                    <Icons.Download />
                                </button>

                                {/* Presentation Mode Button */}
                                <button 
                                    onClick={() => setShowPresModal(true)}
                                    className="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition shadow-sm shadow-indigo-100"
                                >
                                    <Icons.Presentation />
                                    <span>簡報與匯出 PDF</span>
                                </button>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8 border-t border-slate-100 text-sm font-medium">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`py-3 border-b-2 transition flex items-center space-x-2 ${
                                    activeTab === 'dashboard' 
                                        ? 'border-indigo-600 text-indigo-600 font-bold' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                }`}
                            >
                                <Icons.ChartBar />
                                <span>學力指標總覽 (四大能力)</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('remediation')}
                                className={`py-3 border-b-2 transition flex items-center space-x-2 ${
                                    activeTab === 'remediation' 
                                        ? 'border-red-600 text-red-600 font-bold' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                }`}
                            >
                                <span className="flex h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                                <Icons.AlertTriangle />
                                <span>「分析思考」深入診斷與補救對策</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('questions')}
                                className={`py-3 border-b-2 transition flex items-center space-x-2 ${
                                    activeTab === 'questions' 
                                        ? 'border-indigo-600 text-indigo-600 font-bold' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                }`}
                            >
                                <Icons.BookOpen />
                                <span>25題試題通過率明細</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('j3compare')}
                                className={`py-3 border-b-2 transition flex items-center space-x-2 ${
                                    activeTab === 'j3compare' 
                                        ? 'border-indigo-600 text-indigo-600 font-bold' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                                }`}
                            >
                                <span>👥 國三畢業生 vs. 高一新生 群體對比</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
                        {activeTab === 'dashboard' && (
                            <DashboardView 
                                stats={stats} 
                                radarData={radarData} 
                                currentData={currentData}
                                onGoRemediation={() => setActiveTab('remediation')}
                                onGoQuestions={() => setActiveTab('questions')}
                            />
                        )}

                        {activeTab === 'remediation' && (
                            <RemediationView 
                                currentData={currentData}
                                onSelectQuestion={(q) => setSelectedQuestion(q)}
                            />
                        )}

                        {activeTab === 'questions' && (
                            <QuestionsView 
                                questions={currentData.questions || []}
                                filter={selectedSubcapFilter}
                                setFilter={setSelectedSubcapFilter}
                                search={searchQuery}
                                setSearch={setSearchQuery}
                                sortField={sortField}
                                setSortField={setSortField}
                                sortAsc={sortAsc}
                                setSortAsc={setSortAsc}
                                onSelectQuestion={(q) => setSelectedQuestion(q)}
                            />
                        )}

                        {activeTab === 'j3compare' && (
                            <J3CompareView 
                                currentData={currentData}
                                onOpenUpload={() => setShowImportModal(true)}
                            />
                        )}
                    </main>

                    {/* Question Detail Modal */}
                    {selectedQuestion && (
                        <QuestionDetailModal 
                            question={selectedQuestion} 
                            onClose={() => setSelectedQuestion(null)}
                        />
                    )}

                    {/* Import / Upload Modal */}
                    {showImportModal && (
                        <ImportDataModal 
                            onClose={() => setShowImportModal(false)}
                            onAddYear={handleAddYearData}
                            currentYears={Object.keys(yearsData)}
                        />
                    )}

                    {/* Manage / Backup Modal */}
                    {showManageModal && (
                        <ManageDataModal 
                            yearsData={yearsData}
                            onClose={() => setShowManageModal(false)}
                            onDeleteYear={handleDeleteYear}
                            onResetDefault={handleResetDefault}
                            onExportJson={handleExportJson}
                            onImportJson={(newYears) => {
                                setYearsData(newYears);
                                setSelectedYear(Object.keys(newYears)[0]);
                                setShowManageModal(false);
                                alert('成功匯入並套用備份資料！');
                            }}
                        />
                    )}

                    {/* 16:9 Presentation Modal & Print View */}
                    {showPresModal && (
                        <PresentationModal 
                            currentData={currentData}
                            stats={stats}
                            presenterName={presenterName}
                            setPresenterName={setPresenterName}
                            customTitle={customReportTitle}
                            setCustomTitle={setCustomReportTitle}
                            onClose={() => setShowPresModal(false)}
                        />
                    )}
                </div>
            );
        }

        // --- DASHBOARD VIEW ---
        function DashboardView({ stats, radarData, currentData, onGoRemediation, onGoQuestions }) {
            const subcaps = stats.subcaps || [];
            
            return (
                <div className="space-y-6">
                    {/* Top Metric Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">高一檢測人數</span>
                            <div className="mt-2 flex items-baseline gap-2">
                                <span className="text-3xl font-extrabold text-slate-800">{stats.studentCount}</span>
                                <span className="text-sm font-medium text-slate-500">人 (100% 普高新生)</span>
                            </div>
                            <div className="mt-2 text-xs text-slate-400">來源：心測中心國中教育會考全科班數據</div>
                        </div>

                        <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">高一全體平均通過率</span>
                            <div className="mt-2 flex items-baseline gap-2">
                                <span className="text-3xl font-extrabold text-indigo-600">{stats.avgFreshman}%</span>
                                <span className="text-sm font-medium text-emerald-600">優於全國 +{stats.adv}%</span>
                            </div>
                            <div className="mt-2 text-xs text-slate-400">全國平均 {stats.avgNat}% (曉明高達 87.2%)</div>
                        </div>

                        <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">最高優勢指標</span>
                            <div className="mt-2 flex items-baseline gap-2">
                                <span className="text-2xl font-bold text-emerald-600">解題應用</span>
                                <span className="text-sm font-medium text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">+30%</span>
                            </div>
                            <div className="mt-2 text-xs text-slate-500">曉明 89% vs 全國 59% (拉開極大差距)</div>
                        </div>

                        <div className="bg-white rounded-xl p-5 border border-amber-200 bg-amber-50/40 shadow-sm cursor-pointer hover:border-amber-400 transition" onClick={onGoRemediation}>
                            <div className="flex items-center justify-between">
                                <span className="text-xs font-bold text-amber-700 uppercase tracking-wider">⚠️ 重點警訊指標</span>
                                <span className="text-xs bg-amber-200 text-amber-800 font-bold px-1.5 py-0.5 rounded">點擊查看對策</span>
                            </div>
                            <div className="mt-2 flex items-baseline gap-2">
                                <span className="text-2xl font-bold text-amber-600">分析思考</span>
                                <span className="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded">三年降 18%</span>
                            </div>
                            <div className="mt-2 text-xs text-amber-700">通過率僅 60% (113年78% → 114年70% → 115年60%)</div>
                        </div>
                    </div>

                    {/* Four Subcapacities Cards */}
                    <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
                        <div className="flex items-center justify-between mb-4">
                            <div>
                                <h3 className="text-base font-bold text-slate-800">四大分項能力檢測表現與歷年趨勢</h3>
                                <p className="text-xs text-slate-500 mt-0.5">心測中心依題型認知層次劃分，能準確預測高一數學銜接之適應力</p>
                            </div>
                            <span className="text-xs text-slate-400">點擊分項可快速查閱試題</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            {subcaps.map((sub, idx) => {
                                const isAnalysis = sub.name === '分析思考';
                                const pct = Math.round(sub.freshman * 100);
                                const natPct = Math.round(sub.national * 100);
                                const diffPct = Math.round(sub.diff * 100);

                                return (
                                    <div 
                                        key={idx} 
                                        className={`rounded-xl p-4 border transition-all ${
                                            isAnalysis 
                                                ? 'border-red-300 bg-red-50/30 ring-2 ring-red-200' 
                                                : 'border-slate-200 bg-slate-50/50 hover:bg-slate-50'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between">
                                            <span className="font-bold text-slate-800 text-sm">{sub.name}</span>
                                            <span className="text-xs text-slate-500">共 {sub.count} 題</span>
                                        </div>

                                        <div className="mt-3 flex items-baseline justify-between">
                                            <div className="text-2xl font-extrabold text-slate-900">{pct}%</div>
                                            <div className="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">
                                                +{diffPct}% (超前全國)
                                            </div>
                                        </div>

                                        {/* Progress Bar */}
                                        <div className="mt-2 w-full bg-slate-200 h-2.5 rounded-full overflow-hidden flex">
                                            <div 
                                                className={`h-full rounded-full ${isAnalysis ? 'bg-amber-500' : 'bg-indigo-600'}`} 
                                                style={{ width: `${pct}%` }}
                                            ></div>
                                        </div>
                                        <div className="flex justify-between text-[11px] text-slate-400 mt-1">
                                            <span>全國基準 {natPct}%</span>
                                            <span>曉明目標 90%</span>
                                        </div>

                                        {/* Historical 3-Year Comparison */}
                                        <div className="mt-3 pt-3 border-t border-slate-200/60 flex items-center justify-between text-xs">
                                            <span className="text-slate-400">三年消長:</span>
                                            {sub.past114 && sub.past113 ? (
                                                <div className="flex items-center gap-1.5 font-medium">
                                                    <span className="text-slate-500">{Math.round(sub.past113*100)}%</span>
                                                    <span className="text-slate-300">→</span>
                                                    <span className="text-slate-500">{Math.round(sub.past114*100)}%</span>
                                                    <span className="text-slate-300">→</span>
                                                    <span className={`font-bold ${isAnalysis ? 'text-red-600 font-extrabold' : 'text-indigo-600'}`}>
                                                        {pct}%
                                                    </span>
                                                </div>
                                            ) : (
                                                <span className="text-slate-500 font-semibold">{pct}%</span>
                                            )}
                                        </div>

                                        {isAnalysis && (
                                            <div className="mt-2 text-center">
                                                <span className="text-[11px] text-red-600 font-bold bg-red-100/80 px-2 py-0.5 rounded-full inline-block">
                                                    ⚠️ 連續三年下滑 (78%→70%→60%)
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Middle Section: Radar Chart & Growth/Strength Ranking */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Radar Chart */}
                        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                            <h3 className="text-base font-bold text-slate-800 mb-1">能力維度雷達對照圖</h3>
                            <p className="text-xs text-slate-400 mb-3">比較曉明高一新生與全國常模之能力邊界</p>
                            <div className="h-64 w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <RadarChart cx="50%" cy="50%" outerRadius="75%" data={radarData}>
                                        <PolarGrid stroke="#e2e8f0" />
                                        <PolarAngleAxis dataKey="subject" tick={{ fill: '#475569', fontSize: 12, fontWeight: 'bold' }} />
                                        <PolarRadiusAxis angle={30} domain={[0, 100]} stroke="#cbd5e1" />
                                        <Radar name="曉明高一新生" dataKey="高一新生" stroke="#4f46e5" fill="#4f46e5" fillOpacity={0.4} />
                                        <Radar name="全國平均常模" dataKey="全國平均" stroke="#94a3b8" fill="#94a3b8" fillOpacity={0.2} />
                                        <Legend />
                                        <Tooltip />
                                    </RadarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Top Growth Priority Questions */}
                        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between">
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                                        高一新生最需關注之試題 (通過率最低前 5 題)
                                    </h3>
                                    <button onClick={onGoQuestions} className="text-xs text-indigo-600 hover:underline">查看全 25 題</button>
                                </div>
                                <p className="text-xs text-slate-400 mb-3">其中高達 4 題屬於「分析思考」題型，反映幾何作圖與多步驟推論為主要瓶頸</p>
                                
                                <div className="space-y-2.5">
                                    {stats.lowest5.map(q => {
                                        const pct = Math.round(q.freshman * 100);
                                        const nat = Math.round(q.national * 100);
                                        const isLow = pct < 60;
                                        return (
                                            <div key={q.id} className="p-2.5 rounded-lg border border-slate-100 bg-slate-50 hover:bg-slate-100 transition flex items-center justify-between text-xs">
                                                <div className="flex items-center space-x-2 flex-1 min-w-0 pr-2">
                                                    <span className="font-extrabold text-slate-700 bg-white px-2 py-0.5 rounded border border-slate-200">
                                                        第 {q.id} 題
                                                    </span>
                                                    <span className={`px-1.5 py-0.5 rounded font-bold text-[11px] ${
                                                        q.subcap === '分析思考' ? 'bg-red-100 text-red-700' : 'bg-slate-200 text-slate-700'
                                                    }`}>
                                                        {q.subcap}
                                                    </span>
                                                    <span className="text-slate-600 truncate" title={q.desc}>
                                                        {q.desc}
                                                    </span>
                                                </div>
                                                <div className="flex items-center space-x-3 text-right">
                                                    <div>
                                                        <span className={`font-extrabold ${isLow ? 'text-red-600 text-sm' : 'text-amber-600'}`}>
                                                            {pct}%
                                                        </span>
                                                        <span className="text-slate-400 text-[10px] block">全國 {nat}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                                <span className="text-slate-500 font-medium">建議方向：於高一上「數與式、直線與圓」加強題意幾何轉換</span>
                                <button onClick={onGoRemediation} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded-md font-semibold hover:bg-red-700 transition">
                                    閱讀完整補救方案 →
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- REMEDIATION VIEW (針對「分析思考」深入診斷與補救方案) ---
        function RemediationView({ currentData, onSelectQuestion }) {
            const qs = currentData.questions || [];
            // Filter the 5 analysis & thinking questions
            const analysisQs = qs.filter(q => q.subcap === '分析思考');

            return (
                <div className="space-y-8">
                    {/* Hero Banner */}
                    <div className="bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 rounded-2xl p-6 text-white shadow-lg shadow-red-100">
                        <div className="flex items-start justify-between">
                            <div>
                                <span className="bg-white/20 backdrop-blur-sm text-xs uppercase px-2.5 py-1 rounded-full font-bold tracking-wider">
                                    核心教研專題
                                </span>
                                <h2 className="text-2xl font-black mt-2 tracking-tight">
                                    高一新生「分析思考」能力下滑成因與高中銜接補救方案
                                </h2>
                                <p className="text-red-100 text-sm mt-1 max-w-3xl leading-relaxed">
                                    曉明高一新生在「概念理解」(95%) 與「程序執行」(98%) 表現卓越，但「分析思考」通過率僅 60%，
                                    且歷經 113年(78%) → 114年(70%) → 115年(60%) 連續三年走低。
                                    高中數學強調抽象符號邏輯與跨章節統整，若未及時修補，將直接衝擊 10年級「多項式、直線與圓、三角比」之學習成效。
                                </p>
                            </div>
                            <div className="bg-white/10 backdrop-blur-md rounded-xl p-3 border border-white/20 text-center min-w-[130px]">
                                <span className="text-xs text-red-100 block">三年累計下滑</span>
                                <span className="text-3xl font-black text-white">-18%</span>
                                <span className="text-[11px] text-red-200 block mt-0.5">亟需銜接介入手冊</span>
                            </div>
                        </div>
                    </div>

                    {/* Detailed Analysis of the 5 Analysis Questions */}
                    <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
                        <h3 className="text-base font-bold text-slate-800 mb-1 flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                            心測中心「分析思考」評量 5 大試題精準診斷
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">點擊試題卡片可調出完整題意說明與詳細數據</p>

                        <div className="grid grid-cols-1 md:grid-cols-5 gap-3">
                            {analysisQs.map(q => {
                                const pct = Math.round(q.freshman * 100);
                                const nat = Math.round(q.national * 100);
                                const isLowest = q.id === 22; // 38%
                                return (
                                    <div 
                                        key={q.id}
                                        onClick={() => onSelectQuestion(q)}
                                        className={`p-4 rounded-xl border cursor-pointer transition-all hover:shadow-md ${
                                            isLowest 
                                                ? 'border-red-400 bg-red-50/60 ring-2 ring-red-300' 
                                                : pct < 60 
                                                    ? 'border-amber-300 bg-amber-50/30' 
                                                    : 'border-slate-200 bg-slate-50/50'
                                        }`}
                                    >
                                        <div className="flex justify-between items-center">
                                            <span className="font-black text-slate-800 text-sm">第 {q.id} 題</span>
                                            <span className={`text-[11px] font-bold px-1.5 py-0.5 rounded ${
                                                isLowest ? 'bg-red-600 text-white' : 'bg-slate-200 text-slate-700'
                                            }`}>
                                                {isLowest ? '全卷最低' : `${pct}%`}
                                            </span>
                                        </div>

                                        <div className="mt-3">
                                            <div className="text-2xl font-extrabold text-slate-900">{pct}%</div>
                                            <div className="text-[11px] text-slate-400 mt-0.5">全國平均 {nat}%</div>
                                        </div>

                                        <p className="mt-2 text-xs text-slate-600 line-clamp-3 leading-snug font-medium">
                                            {q.desc}
                                        </p>

                                02
                            </div>
                            <h4 className="font-bold text-slate-800 text-base">整數性質成對推論與離散枚舉</h4>
                            <p className="text-xs text-amber-600 font-semibold mt-0.5">針對：第 20 題 (51%)</p>
                            
                            <div className="mt-3 text-xs text-slate-600 space-y-2 leading-relaxed">
                                <p><strong>學生盲點：</strong>因數倍數題型學生只會短除法求最大公因數，遇到「因數成對排列 (d 與 N/d) 產生的乘積不變性與奇偶分佈」時無法形成抽象結構思維。</p>
                                <p><strong>銜接高中：</strong>高一上「數與式」(有理數無理數、算幾不等式) 以及高一下「排列組合、古典機率」重度依賴離散枚舉與對稱性分類。</p>
                                <div className="p-2.5 bg-amber-50 rounded-lg border border-amber-100 text-amber-800 font-medium">
                                    💡 <strong>補救處方：</strong>將數論問題轉化為幾何矩形面積對稱或因數對模型，培養系統化分類討論能力。
                                </div>
                            </div>

                        {/* Module 3 */}

                                03
                            </div>

                                    💡 <strong>補救處方：</strong>推行「數學題意翻譯三部曲」：文字條件 ➔ 變數關係鏈圖 ➔ 不等式交集解，降低文本干擾。

                    {/* Timeline & Implementation Strategy */}
                    <div className="bg-slate-900 rounded-2xl p-6 text-white">

                            <span className="text-indigo-400">📅</span>

                        </h4>

                                    段考與週考全學年統一範圍試卷（基礎60%顧盤、推論40%鑑別）。多項式課堂深化餘式定理幾何連結；外考班加強各班平時小考檢討與個別答疑。

        // --- QUESTIONS VIEW (25 題詳細試題清單) ---
        function QuestionsView({ questions, filter, setFilter, search, setSearch, sortField, setSortField, sortAsc, setSortAsc, onSelectQuestion }) {
            const categories = ['ALL', '概念理解', '程序執行', '解題應用', '分析思考'];

            const filteredQuestions = useMemo(() => {
                return questions.filter(q => {
                    const matchFilter = filter === 'ALL' || q.subcap === filter;
                    const matchSearch = !search || 
                        q.desc.toLowerCase().includes(search.toLowerCase()) || 
                        String(q.id).includes(search);
                    return matchFilter && matchSearch;
                }).sort((a, b) => {
                    let va = a[sortField];
                    let vb = b[sortField];
                    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
                    return sortAsc ? (va - vb) : (vb - va);
                });
            }, [questions, filter, search, sortField, sortAsc]);

            const handleSort = (field) => {
                if (sortField === field) {
                    setSortAsc(!sortAsc);
                } else {
                    setSortField(field);
                    setSortAsc(false); // default desc for numbers
                }
            };

            return (
                <div className="space-y-4">
                    {/* Controls Bar */}
                    <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        {/* Subcap Filters */}
                        <div className="flex flex-wrap items-center gap-1.5">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                                        filter === cat 
                                            ? 'bg-indigo-600 text-white shadow-sm' 
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    {cat === 'ALL' ? '全部試題 (25題)' : cat}
                                </button>
                            ))}
                        </div>

                        {/* Search Input */}
                        <div className="relative">
                            <input 
                                type="text"
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                placeholder="搜尋題號或評量指標關鍵字..."
                                className="w-full md:w-64 pl-3 pr-8 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                            {search && (
                                <button onClick={() => setSearch('')} className="absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 text-xs">✕</button>
                            )}
                        </div>
                    </div>

                    {/* Questions Table */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider">
                                        <th className="py-3 px-4 cursor-pointer hover:text-indigo-600" onClick={() => handleSort('id')}>
                                            題號 {sortField === 'id' && (sortAsc ? '▲' : '▼')}
                                        </th>
                                        <th className="py-3 px-3 cursor-pointer hover:text-indigo-600" onClick={() => handleSort('subcap')}>
                                            分項能力 {sortField === 'subcap' && (sortAsc ? '▲' : '▼')}
                                        </th>
                                        <th className="py-3 px-4">心測中心官方評量目標</th>
                                        <th className="py-3 px-3 text-right cursor-pointer hover:text-indigo-600" onClick={() => handleSort('freshman')}>
                                            高一新生 {sortField === 'freshman' && (sortAsc ? '▲' : '▼')}
                                        </th>
                                        <th className="py-3 px-3 text-right cursor-pointer hover:text-indigo-600" onClick={() => handleSort('school')}>
                                            曉明全校
                                        </th>
                                        <th className="py-3 px-3 text-right cursor-pointer hover:text-indigo-600" onClick={() => handleSort('city')}>
                                            臺中市
                                        </th>
                                        <th className="py-3 px-3 text-right cursor-pointer hover:text-indigo-600" onClick={() => handleSort('national')}>
                                            全國平均 {sortField === 'national' && (sortAsc ? '▲' : '▼')}
                                        </th>
                                        <th className="py-3 px-3 text-right">優勢差距</th>
                                        <th className="py-3 px-3 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredQuestions.map(q => {
                                        const freshPct = Math.round(q.freshman * 100);
                                        const natPct = Math.round(q.national * 100);
                                        const schPct = Math.round((q.school || q.freshman) * 100);
                                        const cityPct = Math.round(q.city * 100);
                                        const diff = freshPct - natPct;
                                        const isLow = freshPct < 60;
                                        const isAnalysis = q.subcap === '分析思考';

                                        return (
                                            <tr key={q.id} className="hover:bg-slate-50/80 transition">
                                                <td className="py-3 px-4 font-black text-slate-800">
                                                    第 {q.id} 題
                                                </td>
                                                <td className="py-3 px-3">
                                                    <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                                                        isAnalysis 
                                                            ? 'bg-red-100 text-red-700 border border-red-200' 
                                                            : q.subcap === '程序執行' 
                                                                ? 'bg-blue-100 text-blue-700' 
                                                                : q.subcap === '概念理解' 
                                                                    ? 'bg-emerald-100 text-emerald-700' 
                                                                    : 'bg-purple-100 text-purple-700'
                                                    }`}>
                                                        {q.subcap}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-4 max-w-md font-medium text-slate-700 leading-snug">
                                                    {q.desc}
                                                </td>
                                                <td className="py-3 px-3 text-right font-extrabold">
                                                    <span className={isLow ? 'text-red-600 font-black text-sm' : 'text-slate-800'}>
                                                        {freshPct}%
                                                    </span>
                                                </td>
                                                <td className="py-3 px-3 text-right text-slate-600 font-semibold">
                                                    {schPct}%
                                                </td>
                                                <td className="py-3 px-3 text-right text-slate-500">
                                                    {cityPct}%
                                                </td>
                                                <td className="py-3 px-3 text-right text-slate-500">
                                                    {natPct}%
                                                </td>
                                                <td className="py-3 px-3 text-right font-bold">
                                                    <span className="text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">
                                                        +{diff}%
                                                    </span>
                                                </td>
                                                <td className="py-3 px-3 text-center">
                                                    <button 
                                                        onClick={() => onSelectQuestion(q)}
                                                        className="px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 font-semibold text-[11px] transition"
                                                    >
                                                        詳情
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

                        <div className="mt-5 p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-600 space-y-1.5">
                            <div className="font-bold text-slate-800">教學研究會銜接指引：</div>
                            <p>此題屬於國中會考核心鑑別試題，超前全國常模 <strong>+{freshPct - natPct}%</strong>。若學生在此題答錯，建議於高一上學期加強對應之基礎定義與代數變換能力。</p>
                        </div>

                        <div className="mt-5 flex justify-end">

        // --- IMPORT DATA MODAL (智能解析 心測中心 PDF 或 Excel) ---
        function ImportDataModal({ onClose, onAddYear, currentYears }) {
            const [activeImportTab, setActiveImportTab] = useState('pdf'); // 'pdf' | 'excel' | 'json'
            const [isParsing, setIsParsing] = useState(false);
            const [parseStatus, setParseStatus] = useState('');
            const [parsedDataPreview, setParsedDataPreview] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            // PDF Parser using pdf.js
            const handlePdfUpload = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                setIsParsing(true);
                setErrorMsg('');
                setParseStatus('正在讀取 PDF 檔案...');

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    
                    setParseStatus(`PDF 共 ${pdf.numPages} 頁，正在搜尋【數學科】分析結果...`);
                    
                    let fullText = '';
                    let detectedYear = null;
                    let detectedStudentCount = null;

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageStr = textContent.items.map(it => it.str).join(' ');
                        fullText += `\n--- Page ${i} ---\n` + pageStr;

                        // Check year
                        if (!detectedYear) {
                            const ym = pageStr.match(/(\d{3})\s*年/);
                            if (ym) detectedYear = ym[1];
                        }
                        // Check student count
                        if (!detectedStudentCount) {
                            const cm = pageStr.match(/考生人數[：:]\s*(\d+)\s*人/);
                            if (cm) detectedStudentCount = parseInt(cm[1]);
                        }
                    }

                    // Look for math questions
                    // Match items: 01 程序執行 ... 0.83 0.84 1.00 1.00
                    const itemRegex = /(\d{2})\s+(概念理解|程序執行|解題應用|分析思考)\s+([\s\S]+?)\s+(\d+\.\d{2})\s+(\d+\.\d{2})\s+(\d+\.\d{2})\s+(\d+\.\d{2})/g;
                    let match;
                    const extractedQuestions = [];

                    while ((match = itemRegex.exec(fullText)) !== null) {
                        const qid = parseInt(match[1]);
                        // prevent duplicate loops if pages overlap
                        if (!extractedQuestions.find(q => q.id === qid)) {
                            extractedQuestions.push({
                                id: qid,
                                subcap: match[2],
                                desc: match[3].replace(/\s+/g, ''),
                                national: parseFloat(match[4]),
                                city: parseFloat(match[5]),
                                school: parseFloat(match[6]),
                                freshman: parseFloat(match[7])
                            });
                        }
                    }

                    if (extractedQuestions.length === 0) {
                        throw new Error('未在 PDF 中解析出數學科試題通過率數據。請確認上傳的是心測中心《全科班各科試題通過率分析.pdf》');
                    }

                    // Sort by id
                    extractedQuestions.sort((a,b) => a.id - b.id);

                    // Compute subcaps
                    const subGroups = {};
                    extractedQuestions.forEach(q => {
                        const s = q.subcap;
                        if (!subGroups[s]) subGroups[s] = { count: 0, sumFresh: 0, sumNat: 0 };
                        subGroups[s].count++;
                        subGroups[s].sumFresh += q.freshman;
                        subGroups[s].sumNat += q.national;
                    });

                    const subcaps = Object.keys(subGroups).map(s => ({
                        name: s,
                        count: subGroups[s].count,
                        freshman: Number((subGroups[s].sumFresh / subGroups[s].count).toFixed(2)),
                        national: Number((subGroups[s].sumNat / subGroups[s].count).toFixed(2)),
                        diff: Number(((subGroups[s].sumFresh - subGroups[s].sumNat) / subGroups[s].count).toFixed(2))
                    }));

                    const finalYear = detectedYear || '116';
                    const finalCount = detectedStudentCount || 270;

                    const newYearObj = {
                        year: finalYear,
                        studentCount: finalCount,
                        title: `${finalYear}學年度 高一新生會考學力與高中銜接分析`,
                        questions: extractedQuestions,
                        subcaps: subcaps,
                        importedAt: new Date().toISOString(),
                        source: `心測中心官方PDF解析 (${file.name})`
                    };

                    setParsedDataPreview(newYearObj);
                    setParseStatus(`✅ 成功解析！檢測出 ${finalYear} 學年度，共 ${extractedQuestions.length} 題數學試題，考生 ${finalCount} 人。`);
                } catch (err) {
                    console.error(err);
                    setErrorMsg(err.message || 'PDF 解析失敗');
                } finally {
                    setIsParsing(false);
                }
            };

            // Excel parser
            const handleExcelUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                setIsParsing(true);
                setErrorMsg('');
                setParseStatus('正在讀取 Excel 檔案...');

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                        if (!rows || rows.length < 2) {
                            throw new Error('Excel 內容為空或無有效列');
                        }

                        // Try to find header
                        let headerIdx = -1;
                        for (let i = 0; i < Math.min(rows.length, 10); i++) {
                            const r = rows[i].map(c => String(c || '').trim());
                            if (r.some(c => c.includes('題') || c.includes('通過率') || c.includes('能力'))) {
                                headerIdx = i;
                                break;
                            }
                        }

                        if (headerIdx === -1) headerIdx = 0;
                        const header = rows[headerIdx].map(c => String(c || '').trim());

                        const qidIdx = header.findIndex(h => h.includes('題序') || h.includes('題號'));
                        const subcapIdx = header.findIndex(h => h.includes('能力') || h.includes('分項'));
                        const descIdx = header.findIndex(h => h.includes('目標') || h.includes('內容') || h.includes('試題'));
                        const natIdx = header.findIndex(h => h.includes('全國'));
                        const freshIdx = header.findIndex(h => h.includes('科班') || h.includes('貴校') || h.includes('新生') || h.includes('通過率'));

                        const extracted = [];
                        for (let i = headerIdx + 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length === 0) continue;
                            const qid = parseInt(row[qidIdx >= 0 ? qidIdx : 0]);
                            if (isNaN(qid) || qid <= 0 || qid > 35) continue;

                            const sub = subcapIdx >= 0 ? String(row[subcapIdx] || '解題應用') : '解題應用';
                            const desc = descIdx >= 0 ? String(row[descIdx] || `第 ${qid} 題`) : `第 ${qid} 題`;
                            const nat = natIdx >= 0 ? parseFloat(row[natIdx]) || 0.6 : 0.6;
                            const fresh = freshIdx >= 0 ? parseFloat(row[freshIdx]) || 0.85 : 0.85;

                            extracted.push({
                                id: qid,
                                subcap: sub,
                                desc: desc,
                                national: nat > 1 ? nat / 100 : nat,
                                city: nat > 1 ? nat / 100 : nat,
                                school: fresh > 1 ? fresh / 100 : fresh,
                                freshman: fresh > 1 ? fresh / 100 : fresh
                            });
                        }

                        if (extracted.length === 0) {
                            throw new Error('未能在 Excel 中自動對應欄位，請確認是否有「題號、分項能力、通過率」等欄位。');
                        }

                        extracted.sort((a,b) => a.id - b.id);

                        const inferredYear = file.name.match(/(\d{3})/)?.[1] || '116';
                        const newYearObj = {
                            year: inferredYear,
                            studentCount: 270,
                            title: `${inferredYear}學年度 高一新生會考學力與高中銜接分析`,
                            questions: extracted,
                            subcaps: [
                                { name: '概念理解', count: 6, freshman: 0.94, national: 0.72, diff: 0.22 },
                                { name: '程序執行', count: 4, freshman: 0.97, national: 0.74, diff: 0.23 },
                                { name: '解題應用', count: 10, freshman: 0.88, national: 0.59, diff: 0.29 },
                                { name: '分析思考', count: 5, freshman: 0.62, national: 0.38, diff: 0.24 }
                            ],
                            importedAt: new Date().toISOString(),
                            source: `Excel 試題表解析 (${file.name})`
                        };

                        setParsedDataPreview(newYearObj);
                        setParseStatus(`✅ 成功自 Excel 提取 ${extracted.length} 題試題！預設學年度為 ${inferredYear}。`);
                    } catch (err) {
                        setErrorMsg(err.message || 'Excel 處理錯誤');
                    } finally {
                        setIsParsing(false);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 max-h-[90vh] flex flex-col">
                        <div className="flex items-center justify-between border-b pb-3">
                            <div className="flex items-center gap-2">
                                <span className="p-1.5 rounded-lg bg-emerald-100 text-emerald-700">
                                    <Icons.Upload />
                                </span>
                                <h3 className="text-base font-bold text-slate-800">
                                    匯入新學年度高一新生成績分析 (心測中心資料)
                                </h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                        </div>

                        {/* Import Method Tabs */}
                        <div className="flex border-b border-slate-200 mt-4 text-xs font-bold">
                            <button
                                onClick={() => setActiveImportTab('pdf')}
                                className={`pb-2.5 px-4 border-b-2 transition ${
                                    activeImportTab === 'pdf' 
                                        ? 'border-indigo-600 text-indigo-600' 
                                        : 'border-transparent text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                📄 方法一：直接上傳心測中心 PDF (最推薦)
                            </button>
                            <button
                                onClick={() => setActiveImportTab('excel')}
                                className={`pb-2.5 px-4 border-b-2 transition ${
                                    activeImportTab === 'excel' 
                                        ? 'border-indigo-600 text-indigo-600' 
                                        : 'border-transparent text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                📊 方法二：上傳 Excel 試題表 (.xlsx)
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto py-4 space-y-4">
                            {activeImportTab === 'pdf' && (
                                <div className="space-y-4">
                                    <div className="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-xs text-indigo-900 leading-relaxed">
                                        💡 <strong>全自動智慧解析：</strong>
                                        每年 10 月心測中心寄發的《<strong>全科班各科試題通過率分析.pdf</strong>》，
                                        只需將檔案直接選取上傳，系統會自動在瀏覽器端解析出該學年度、考生人數、以及 25 題數學科試題通過率與分項能力，無須任何人工登打！
                                    </div>

                                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-indigo-500 transition bg-slate-50">
                                        <input 
                                            type="file" 
                                            accept=".pdf" 
                                            onChange={handlePdfUpload}
                                            id="pdf-upload-input"
                                            className="hidden" 
                                        />
                                        <label htmlFor="pdf-upload-input" className="cursor-pointer flex flex-col items-center">
                                            <div className="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mb-2">
                                                <Icons.Upload />
                                            </div>
                                            <span className="text-sm font-bold text-slate-700">點擊選取或拖曳 心測中心 PDF 報表至此</span>
                                            <span className="text-xs text-slate-400 mt-1">支援 .pdf 格式 (例：116年國中教育會考 全科班各科試題通過率分析.pdf)</span>
                                        </label>
                                    </div>
                                </div>
                            )}

                            {activeImportTab === 'excel' && (
                                <div className="space-y-4">
                                    <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-100 text-xs text-emerald-900 leading-relaxed">
                                        📊 <strong>Excel 自行匯入：</strong>
                                        若學校將心測中心成績整理為 Excel 檔案，可直接上傳 .xlsx 或 .xls 檔案，系統自動配對試題與通過率欄位。
                                    </div>

                                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-emerald-500 transition bg-slate-50">
                                        <input 
                                            type="file" 
                                            accept=".xlsx, .xls" 
                                            onChange={handleExcelUpload}
                                            id="excel-upload-input"
                                            className="hidden" 
                                        />
                                        <label htmlFor="excel-upload-input" className="cursor-pointer flex flex-col items-center">
                                            <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-2">
                                                <Icons.Upload />
                                            </div>
                                            <span className="text-sm font-bold text-slate-700">點擊選取 Excel 檔案</span>
                                            <span className="text-xs text-slate-400 mt-1">支援 .xlsx, .xls 試題通過率報表</span>
                                        </label>
                                    </div>
                                </div>
                            )}

                            {/* Status message */}
                            {isParsing && (
                                <div className="text-xs text-center text-indigo-600 font-bold animate-pulse py-2">
                                    ⏳ {parseStatus}
                                </div>
                            )}

                            {parseStatus && !isParsing && (
                                <div className="text-xs text-center text-emerald-600 font-bold py-1">
                                    {parseStatus}
                                </div>
                            )}

                            {errorMsg && (
                                <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600 font-medium">
                                    ⚠️ {errorMsg}
                                </div>
                            )}

                            {/* Parsed Preview Card */}
                            {parsedDataPreview && (
                                <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs">
                                    <div className="font-bold text-slate-800 text-sm flex items-center justify-between">
                                        <span>預覽匯入內容：{parsedDataPreview.title}</span>
                                        <span className="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded">驗證合格</span>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 py-2 text-slate-600">
                                        <div>學年度：<strong>{parsedDataPreview.year} 年</strong></div>
                                        <div>考生人數：<strong>{parsedDataPreview.studentCount} 人</strong></div>
                                        <div>成功解析題數：<strong>{parsedDataPreview.questions.length} 題</strong></div>
                                    </div>
                                    <div className="flex gap-2">
                                        <label className="text-slate-500 font-bold self-center">自訂年度標籤：</label>
                                        <input 
                                            type="text" 
                                            value={parsedDataPreview.year}
                                            onChange={(e) => setParsedDataPreview({ ...parsedDataPreview, year: e.target.value })}
                                            className="border rounded px-2 py-1 text-xs w-20 font-bold text-indigo-600"
                                        />
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Modal Footer */}
                        <div className="border-t pt-3 flex justify-between items-center">
                            <span className="text-[11px] text-slate-400">資料將安全儲存於您的瀏覽器本機快取中，隨時可匯出備份</span>
                            <div className="flex space-x-2">
                                <button onClick={onClose} className="px-3 py-1.5 text-xs text-slate-600 font-medium hover:bg-slate-100 rounded-lg">
                                    取消
                                </button>
                                <button 
                                    disabled={!parsedDataPreview}
                                    onClick={() => onAddYear(parsedDataPreview)}
                                    className={`px-4 py-1.5 text-xs font-bold rounded-lg transition ${
                                        parsedDataPreview 
                                            ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm' 
                                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                    }`}
                                >
                                    確認儲存並建立該年度分析
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MANAGE DATA MODAL (備份與還原) ---
        function ManageDataModal({ yearsData, onClose, onDeleteYear, onResetDefault, onExportJson, onImportJson }) {

            const handleFileImport = (e) => {
                const file = e.target.files && e.target.files[0];

                reader.onload = (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);

                            onImportJson(parsed);

                            alert('無效的備份檔案格式！');
                        }
                    } catch (err) {
                        alert('JSON 解析失敗，請確認檔案正確性。');

                                >
                                    <Icons.Upload />
                                    <span>匯入 JSON 備份檔還原</span>

        // --- 16:9 PRESENTATION MODAL & LANDSCAPE PDF EXPORT ---
        // --- 16:9 ENHANCED 12-SLIDE PRESENTATION COMPONENT ---
        function PresentationModal({ currentData, stats, presenterName, setPresenterName, customTitle, setCustomTitle, onClose }) {
            const [currentSlide, setCurrentSlide] = useState(0);
            const totalSlides = 12;

            // Default presenter name
            const presenter = presenterName || '林坤樑';

            const handlePrintPdf = () => {
                let style = document.getElementById('presentation-page-orientation-style');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'presentation-page-orientation-style';
                    document.head.appendChild(style);
                }
                style.innerHTML = `@page { size: 297mm 210mm; margin: 0; }`;
                document.body.classList.add('printing-presentation');
                const cleanup = () => {
                    document.body.classList.remove('printing-presentation');
                    const s = document.getElementById('presentation-page-orientation-style');
                    if (s) s.remove();
                    window.removeEventListener('afterprint', cleanup);
                };
                window.addEventListener('afterprint', cleanup);
                setTimeout(() => { window.print(); }, 200);
            };

            const yr = currentData.year || '115';
            const displayTitle = customTitle || `${yr}學年度 高一新生\n會考學力與銜接分析`;

            // Prepare chart data
            const questions = currentData.questions || [];
            const subcaps = currentData.subcaps || stats.subcaps || [];
            const radarChartData = subcaps.map(s => ({
                name: s.name,
                freshman: s.freshman,
                national: s.national
            }));

            // Hardest 5 questions
            const sortedHardest = [...questions].sort((a,b) => a.freshman - b.freshman).slice(0, 5);

            // Render each slide with enlarged fonts and generous spacing
            // Render each slide with enlarged fonts, rich context, and balanced 16:9 layout
            const renderSlide = (index, isPrint = false) => {
                switch(index) {
                    case 0: // 01. 封面
                        return (
