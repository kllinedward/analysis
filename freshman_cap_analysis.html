                        return (
                            <div className="flex-1 flex flex-col justify-between p-1">
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 text-center mb-1.5">07. 正式課程深耕：三角比（第13~16週）</h2>
                                <div className="flex-1 bg-white rounded-2xl p-4 sm:p-5 border-2 border-slate-200 shadow-sm flex flex-col justify-between">
                                    <div className="flex items-center justify-between py-2 px-4 bg-amber-50 rounded-xl border-2 border-amber-300 mb-3">
                                        <span className="font-black text-amber-900 text-base sm:text-lg">會考診斷：Q21（相似形 66%）與 Q22（角平分線 38%）</span>
                                        <span className="text-xs sm:text-sm bg-red-600 text-white font-black px-3 py-1 rounded-lg shadow-sm">幾何坐標化</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 flex-1">
                                        <div className="p-4 sm:p-5 bg-red-50/70 rounded-xl border-2 border-red-300 shadow-sm flex flex-col justify-start">
                                            <h4 className="font-black text-lg sm:text-xl text-red-900 mb-3 pb-2 border-b border-red-200 flex items-center gap-2">
                                                <span>⚠️</span> 會考最低弱點之成因（Q22: 38%）
                                            </h4>
                                            <ul className="space-y-2.5 text-[15px] sm:text-base text-red-950 leading-relaxed font-semibold">
                                                <li>• 第 22 題通過率僅 38%，平行線截比與角平分線多步驟推理為弱點。</li>
                                                <li>• 學生習慣憑圖形外觀直覺代公式，缺乏反例構造與論證證偽能力。</li>
                                                <li>• 純幾何易有恐懼感，高中藉由「坐標系與向量」將幾何盲點徹底降維。</li>
                                                <li>• <b>突破之道</b>：以解析坐標取代傳統純幾何輔助線，化難為易。</li>
                                            </ul>
                                        </div>
                                        <div className="p-4 sm:p-5 bg-amber-50/70 rounded-xl border-2 border-amber-300 shadow-sm flex flex-col justify-start">
                                            <h4 className="font-black text-lg sm:text-xl text-amber-900 mb-3 pb-2 border-b border-amber-200 flex items-center gap-2">
                                                <span>🎯</span> 三角比正式教學定位
                                            </h4>
                                            <ul className="space-y-2.5 text-[15px] sm:text-base text-amber-950 leading-relaxed font-semibold">
                                                <li>• 講授三角比（sin, cos, tan）回歸「相似形邊長比值不變量」幾何定義。</li>
                                                <li>• 嚴禁死記口訣，需由直角三角形無縫推進至「單位圓坐標定義」。</li>
                                                <li>• 提前打通幾何與代數函數壁壘，為高一下「廣義角與正餘弦」奠基。</li>
                                                <li>• <b>思維躍升</b>：以三角比賦予幾何旋轉與投影意義，破除死背直覺。</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );

                    case 8: // 09. 五大低通過率試題檢視
                        return (
                            <div className="flex-1 flex flex-col justify-between p-1">
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 text-center mb-1.5">08. 高一新生五大低通過率題目檢視</h2>
                                <div className="flex-1 bg-white rounded-2xl p-4 sm:p-5 border-2 border-slate-200 shadow-sm flex flex-col justify-between overflow-hidden">
                                    <div className="space-y-2.5 my-auto w-full">
                                        {sortedHardest.map((q, idx) => (
                                            <div key={q.id} className="flex items-center justify-between p-2.5 sm:p-3 bg-slate-50 rounded-xl border-2 border-slate-200 shadow-sm">
                                                <div className="flex items-center gap-3 flex-1 min-w-0 pr-3 overflow-hidden">
                                                    <span className="w-7 h-7 rounded-full bg-slate-800 text-white font-black flex items-center justify-center text-xs flex-shrink-0">{idx+1}</span>
                                                    <span className="font-black text-base text-slate-900 whitespace-nowrap flex-shrink-0">第 {q.id} 題 ({q.subcap})</span>
                                                    <span className="text-[14px] sm:text-[15px] text-slate-700 font-medium truncate block flex-1 min-w-0" title={q.desc}>{q.desc}</span>
                                                </div>
                                                <div className="flex-shrink-0 text-right whitespace-nowrap pl-2">
                                                    <span className="font-black text-xl text-blue-700">{(q.freshman * 100).toFixed(0)}%</span>
                                                    <span className="text-xs text-slate-500 font-bold ml-1.5">({((q.freshman - q.national)*100).toFixed(0)}% 領先)</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        );

                    case 9: // 10. 直升班 vs 外考班 分班適性教學策略
                        return (
                            <div className="flex-1 flex flex-col justify-between p-1">
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 text-center mb-1.5">09. 高一分班適性教學策略：直升班 vs. 外考班</h2>
                                <div className="flex-1 bg-white rounded-2xl p-4 sm:p-5 border-2 border-slate-200 shadow-sm flex flex-col justify-between">
                                    <div className="grid grid-cols-2 gap-4 flex-1">
                                        {/* Left: 直升班 */}
                                        <div className="p-4 bg-indigo-50/80 rounded-xl border-2 border-indigo-200 shadow-sm flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-2.5 border-b border-indigo-200 pb-2">
                                                    <h4 className="font-black text-lg sm:text-xl text-indigo-950 flex items-center gap-2">
                                                        <span className="text-2xl">🎓</span> 直升班：高階論證・深度拔尖
                                                    </h4>
                                                    <span className="text-xs bg-indigo-600 text-white font-black px-2.5 py-0.5 rounded-full">直升班專屬</span>
                                                </div>
                                                <ul className="text-[14px] sm:text-[15px] leading-relaxed text-indigo-950 font-semibold space-y-2">
                                                    <li>• <b>學力特質</b>：概念與程序極強（98%~99%），公式手感敏捷，但易流於套題型反射。</li>
                                                    <li>• <b>課堂教學策略</b>：基礎運算快速帶過，課堂時間重度投資於幾何反例證偽、多步驟代數建模與跨章節大考混合題。</li>
                                                    <li>• <b>各班平時測驗與作業</b>：因段考與週考全校統一，分軌落實於各班小考。課堂隨堂小考拉高推論題佔比（40%~50%），徹底激發資優潛能。</li>
                                                </ul>
                                            </div>
                                            <div className="text-xs bg-indigo-200 text-indigo-900 font-bold px-3 py-1 rounded-lg w-fit mt-2">深度挑戰・思維深化</div>
                                        </div>

                                        {/* Right: 外考班 */}
                                        <div className="p-4 bg-emerald-50/80 rounded-xl border-2 border-emerald-200 shadow-sm flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-2.5 border-b border-emerald-200 pb-2">
                                                    <h4 className="font-black text-lg sm:text-xl text-emerald-950 flex items-center gap-2">
                                                        <span className="text-2xl">🌱</span> 外考班：規範板書・穩固自信
                                                    </h4>
                                                    <span className="text-xs bg-emerald-600 text-white font-black px-2.5 py-0.5 rounded-full">外考班專屬</span>
                                                </div>
                                                <ul className="text-[14px] sm:text-[15px] leading-relaxed text-emerald-950 font-semibold space-y-2">
                                                    <li>• <b>學力特質</b>：來自各國中不同教學風格，初入曉明私校面對快節奏與高強度易產生焦慮感。</li>
                                                    <li>• <b>課堂教學策略</b>：課堂落實嚴謹板書與定義說理，標準示範高中數學符號語言與論證過程，奠定扎實手感。</li>
                                                    <li>• <b>各班平時測驗與輔導</b>：因段考與週考全校統一，平時小考以基礎觀念題（65%~70%）顧底，搭配詳解與及時輔導，穩健迎戰週考與段考。</li>
                                                </ul>
                                            </div>
                                            <div className="text-xs bg-emerald-200 text-emerald-900 font-bold px-3 py-1 rounded-lg w-fit mt-2">穩健扎根・信心扶持</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );

                    case 10: // 11. 行動方案總結
                        return (
                            <div className="flex-1 flex flex-col justify-between p-1">
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 text-center mb-1.5">10. 高一數學正式課堂三大教學落地行動</h2>
                                <div className="flex-1 grid grid-cols-3 gap-4 bg-white rounded-2xl p-4 sm:p-5 border-2 border-slate-200 shadow-sm">
                                    <div className="p-4 sm:p-5 bg-blue-50/80 rounded-xl border-2 border-blue-200 flex flex-col justify-between shadow-sm">
                                        <div>
                                            <div className="font-black text-lg sm:text-xl text-blue-900 mb-2">行動一：各班教學與平時測驗分軌</div>
                                            <p className="text-[14px] sm:text-[15px] leading-relaxed text-blue-950 font-semibold">
                                                段考與週考全校統一；平時測驗由任課教師自主掌握：直升班隨堂小考拉高推論拔尖，外考班平時小考基礎顧底建立信心。
                                            </p>
                                        </div>
                                        <div className="text-xs bg-blue-200 text-blue-900 font-extrabold px-3 py-1 rounded-lg w-fit mt-3">適性施教</div>
                                    </div>
                                    <div className="p-4 sm:p-5 bg-indigo-50/80 rounded-xl border-2 border-indigo-200 flex flex-col justify-between shadow-sm">
                                        <div>
                                            <div className="font-black text-lg sm:text-xl text-indigo-900 mb-2">行動二：常態進度融入高階思維題</div>
                                            <p className="text-[14px] sm:text-[15px] leading-relaxed text-indigo-950 font-semibold">
                                                不另設額外銜接課，於高一各單元常態進度中每週穿插 1~2 題「分析思考」大考趨勢題，在正規教學中自然滲透。
                                            </p>
                                        </div>
                                        <div className="text-xs bg-indigo-200 text-indigo-900 font-extrabold px-3 py-1 rounded-lg w-fit mt-3">進度融合</div>
                                    </div>
                                    <div className="p-4 sm:p-5 bg-purple-50/80 rounded-xl border-2 border-purple-200 flex flex-col justify-between shadow-sm">
                                        <div>
                                            <div className="font-black text-lg sm:text-xl text-purple-900 mb-2">行動三：段考與週考統一兼顧鑑別</div>
                                            <p className="text-[14px] sm:text-[15px] leading-relaxed text-purple-950 font-semibold">
                                                全學年段考與週考皆同一試卷，命題結構採「基礎題 60% 顧穩外考與及格盤、中高階推論 40% 精準鑑別直升與頂尖拔尖」。
                                            </p>
                                        </div>
                                        <div className="text-xs bg-purple-200 text-purple-900 font-extrabold px-3 py-1 rounded-lg w-fit mt-3">公平兼顧</div>
                                    </div>
                                </div>
                            </div>
                        );

                    case 11: // 12. 結尾
                        return (
                            <div className="flex-1 flex flex-col items-center justify-center space-y-7">
                                <div className="text-7xl">🎓</div>
                                <h1 className="text-6xl lg:text-7xl font-black text-slate-900 tracking-wider">
                                    深入洞察・引領卓越
                                </h1>
                                <p className="text-slate-600 text-3xl font-extrabold">
                                    曉明女中 高中部數學科教學研究會
                                </p>
                                <div className="pt-4 flex items-center gap-3 text-xl text-slate-800 font-black bg-slate-100 px-10 py-4 rounded-full border-2 border-slate-300 shadow-md">
                                    <span>📐</span>
                                    <span>簡報人：{presenter}</span>
                                </div>
                            </div>
                        );

                    default:
                        return null;
                }
            };

            return (
                <div>
                    {/* Screen Modal for Interactive Slides */}
                    <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex flex-col justify-between items-center p-2 sm:p-4 no-print">
                        {/* Top Toolbar */}
                        <div className="w-full max-w-6xl bg-slate-900 text-white rounded-xl px-4 py-2.5 flex items-center justify-between shadow-2xl mb-2 border border-slate-700">
                            <div className="flex items-center gap-3">
                                <span className="text-lg">📽️</span>
                                <span className="font-bold text-sm hidden sm:inline">高一新生學力簡報模式</span>
                                <span className="bg-indigo-600 px-2.5 py-0.5 rounded text-xs font-bold">16:9 橫向</span>
                                <div className="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700 text-xs text-white ml-2">
                                    <span className="text-slate-400">簡報人：</span>
                                    <input 
                                        type="text" 
                                        value={presenter} 
                                        onChange={(e) => {
                                            setPresenterName(e.target.value);
                                            localStorage.setItem('freshman_pres_presenter', e.target.value);
                                        }}
                                        className="w-24 bg-slate-900 text-teal-300 font-bold px-1.5 py-0.5 rounded border border-slate-600 text-center focus:outline-none focus:border-teal-400"
                                        title="點擊修改簡報人姓名"
                                    />
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={() => setCurrentSlide(c => Math.max(0, c - 1))} 
                                    disabled={currentSlide === 0} 
                                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 rounded text-xs font-bold transition"
                                >
                                    ◀ 上一頁
                                </button>
                                <select 
                                    value={currentSlide} 
                                    onChange={(e) => setCurrentSlide(parseInt(e.target.value))}
                                    className="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded border border-slate-600 focus:outline-none"
                                >
                                    <option value={0}>01. 封面：{yr}高一新生成績分析</option>
                                    <option value={1}>02. 高一新生入學整體表現</option>
                                    <option value={2}>03. 四大分項能力輪廓與趨勢</option>
                                    <option value={3}>04. 國三 vs 高一新生學力對比</option>
                                    <option value={4}>05. 正式課程深耕：數與式</option>
                                    <option value={5}>06. 正式課程深耕：多項式函數</option>
                                    <option value={6}>07. 正式課程深耕：直線與圓</option>
                                    <option value={7}>08. 正式課程深耕：三角比</option>
                                    <option value={8}>09. 五大低通過率題目檢視</option>
                                    <option value={9}>10. 分班適性教學：直升班 vs. 外考班</option>
                                    <option value={10}>11. 正式課堂三大落地行動</option>
                                    <option value={11}>12. 深入洞察・引領卓越</option>
                                </select>
                                <button 
                                    onClick={() => setCurrentSlide(c => Math.min(totalSlides - 1, c + 1))} 
                                    disabled={currentSlide === totalSlides - 1} 
                                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 rounded text-xs font-bold transition"
                                >
                                    下一頁 ▶
                                </button>
                            </div>

                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={handlePrintPdf} 
                                    className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                                    title="列印為 16:9 橫向 PDF"
                                >
                                    <Icons.Download />
                                    <span>匯出 16:9 PDF (橫向)</span>
                                </button>
                                <button 
                                    onClick={onClose} 
                                    className="px-2.5 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded text-xs font-bold transition"
                                >
                                    ✕ 離開
                                </button>
                            </div>
                        </div>

                        {/* Slide Viewport */}
                        <div className="w-full max-w-6xl aspect-video bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between p-4 sm:p-5 border border-slate-200 relative select-none">
                            {renderSlide(currentSlide, false)}
                            <div className="absolute bottom-3 right-5 text-xs text-slate-400 font-mono font-bold">
                                {currentSlide + 1} / {totalSlides}
                            </div>
                        </div>

                        {/* Footer Tips */}
                        <div className="text-slate-300 text-xs mt-2 flex flex-wrap items-center justify-center gap-4">
                            <span>💡 按 <b>← / →</b> 切換投影片</span>
                            <span className="bg-amber-400/20 text-amber-300 font-bold px-2.5 py-0.5 rounded border border-amber-400/40">
                                ⚠️ 匯出 PDF 提示：請在列印目的地選擇【另存為 PDF】、紙張尺寸選 A4，邊界選【無】
                            </span>
                        </div>
                    </div>

                    {/* Dedicated Print Container for 16:9 PDF Export (Exact 12 pages) */}
                    <div className="presentation-print-container">
                        {Array.from({ length: totalSlides }).map((_, idx) => (
                            <div key={idx} className="presentation-slide-print">
                                {renderSlide(idx, true)}
                                <div className="text-right text-xs text-slate-400 pt-2 font-mono">
                                    {idx + 1} / {totalSlides}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Mount React App
        ReactDOM.createRoot(document.getElementById('root')).render(<FreshmanCapApp />);
    </script>
</body>
</html>
